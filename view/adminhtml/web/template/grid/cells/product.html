<div class="data-grid-cell-content">
    <span text="$col.getField($row(), 'qty')"></span>x&nbsp;
    <a data-bind="attr: {href: $col.getField($row(), 'href')}" text="$col.getField($row(), 'label')"></a>
    <div class="options-wrapper" each="$col.getField($row(), 'options')">
        <span text="label"></span>:&nbsp;<b text="value"></b><br/>
    </div>
</div>
