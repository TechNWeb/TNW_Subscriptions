<div class="block quotes-in-cart">
    <!-- ko foreach: {data: quotes, as: 'quote'} -->
    <div class="content minisub-quote">
        <div class="minisub-quote-wrapper overflowed">
            <div class="title" data-bind="text: quote.getProfileName()"></div>
            <div class="content minisub-items" data-role="content">
                <ol class="minisub-items">
                    <!-- ko foreach: {data: quote.getItems(), as: 'item'} -->
                    <li class="product-item">
                        <div class="product">
                            <span class="product-image-container" data-bind="attr: {'style': 'height: ' + item.thumbnail.height + 'px; width: ' + item.thumbnail.width + 'px;' }">
                                <span class="product-image-wrapper">
                                    <img data-bind="attr: {'src': item.thumbnail.src, 'width': item.thumbnail.width, 'height': item.thumbnail.height, 'alt': item.thumbnail.alt }">
                                </span>
                            </span>
                            <div class="product-item-details">
                                <div class="product-item-inner">
                                    <div class="product-item-name-block">
                                        <span class="qty" data-bind="text: item.qty+'x'"></span>
                                        <span class="product-item-name" data-bind="text: item.name"></span>
                                    </div>
                                </div>
                                <!-- ko if: (item.options.length > 0)-->
                                <div class="product options" data-bind="mageInit: {'collapsible':{'openedState': 'active'}}">
                                    <span data-role="title" class="toggle"><!-- ko i18n: 'View Details' --><!-- /ko --></span>
                                    <div data-role="content" class="content">
                                        <strong class="subtitle"><!-- ko i18n: 'Options Details' --><!-- /ko --></strong>
                                        <dl class="item-options">
                                            <!-- ko foreach: item.options -->
                                                <dt class="label" data-bind="text: label"></dt>
                                                <!-- ko if: ($data.full_view)-->
                                                    <dd class="values" data-bind="html: full_view"></dd>
                                                <!-- /ko -->
                                                <!-- ko ifnot: ($data.full_view)-->
                                                    <dd class="values" data-bind="html: value"></dd>
                                                <!-- /ko -->
                                            <!-- /ko -->
                                        </dl>
                                    </div>
                                </div>
                                <!-- /ko -->
                            </div>
                        </div>
                    </li>
                    <!-- /ko -->
                </ol>
            </div>
            <div class="description" data-bind="text: quote.getProfileDescription()"></div>
        </div>
    </div>
    <!-- /ko -->
</div>
