<select class="control-select"
        attr="'data-container': dataContainer"
        data-bind="
            attr: {
                name: inputName,
                id: uid,
                disabled: disabled,
                'aria-describedby': noticeId
            },
            hasFocus: focused,
            optgroup: options,
            value: value,
            optionsCaption: caption,
            optionsValue: 'value',
            optionsText: 'label'"
/>
