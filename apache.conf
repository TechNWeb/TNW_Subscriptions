<VirtualHost *:80>
  DocumentRoot "/var/www/html/magento"
  ServerName 127.0.0.1

  <FilesMatch \.php$>
    SetHandler application/x-httpd-php
  </FilesMatch>

  <Directory "/var/www/html/magento">
      Options Indexes FollowSymLinks MultiViews
      AllowOverride All
  </Directory>

</VirtualHost>
