<select class="admin__control-select" data-bind="
    attr: {
        name: inputName,
        id: uid,
        disabled: disabled,
        'aria-describedby': noticeId
    },
    hasFocus: focused,
    value: value,
    foreach: options"
>
    <option data-bind="attr: { disabled: disabled, value: value }, text: label"></option>
</select>
