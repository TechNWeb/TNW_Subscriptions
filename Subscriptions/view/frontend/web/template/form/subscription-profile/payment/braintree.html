<div class="fieldset-wrapper"
     css="$data.additionalClasses"
     attr="'data-level': $data.level, 'data-index': index"
     data-bind="visible: $data.visible === undefined ? true: $data.visible">

    <div class="fieldset-wrapper-content"
         css="'collapsible-content': collapsible, '_show': opened, '_hide': !opened()">
        <form id="co-transparent-form-braintree" class="fieldset" method="post">
            <div class="field credit-card-number _required-number">
                <label class="label">
                    <span>Credit Card Number</span>
                </label>
                <div class="control">
                    <div id="card-number" class="control-text" style="height: 26px;border: 1px solid #c2c2c2;padding: 3px;"></div>
                </div>
            </div>
            <fieldset class="field field_without_legend _required-date control-fields required">
                <legend class="label">
                    <span>Expiration Date</span>
                </legend>
                <div class="control">
                    <div class="field control-label-up select month _required" name="data.payment.payflowpro.additional.cc_exp_month">
                        <div class="control">
                            <div id="expiration-month" class="control-text" style="height: 26px;border: 1px solid #c2c2c2;padding: 3px;"></div>
                        </div>
                    </div>
                    <div class="field control-label-up select year _required" name="data.payment.payflowpro.additional.cc_exp_year">
                        <div class="control">
                            <div id="expiration-year" class="control-text" style="height: 26px;border: 1px solid #c2c2c2;padding: 3px;"></div>
                        </div>
                    </div>
                </div>
            </fieldset>
            <div class="field payment-cvv _required" name="data.payment.payflowpro.additional.cc_cid" style="">
                <label class="label">
                    <span>Card Verification Number</span>
                </label>

                <div class="control">
                    <div id="cvv" class="control-text" style="height: 26px;border: 1px solid #c2c2c2;padding: 3px;"></div>
                </div>
            </div>
            <input id="braintree_submit" style="display:none" type="submit">
        </form>
    </div>
</div>
