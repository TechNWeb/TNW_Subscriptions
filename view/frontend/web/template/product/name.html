<strong if="isAllowed()"
        class="product-item-name">
    <a attr="href: $row().url" html="getNameUnsanitizedHtml($col.getLabel($row()))"/>

        class="product-item-name">
    <span html="$row()['extension_attributes']['subs_top_message']"/>
</strong>
