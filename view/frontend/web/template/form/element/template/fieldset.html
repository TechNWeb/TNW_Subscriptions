<div class="fieldset-wrapper"
     css="$data.additionalClasses"
     attr="'data-level': $data.level, 'data-index': index"
     data-bind="visible: $data.visible === undefined ? true: $data.visible">
    <div class="fieldset-wrapper-title"
         attr="tabindex: !collapsible ? -1 : 0,
               'data-state-collapsible': collapsible ? opened() ? 'open' : 'closed' : null"
         click="toggleOpened"
         keyboard="13: toggleOpened"
         if="label">

        <strong css="'collapsible-title': collapsible,
                      title: !collapsible,
                      '_changed': changed,
                      '_loading': loading,
                      '_error': error">
            <span translate="label"></span>
            <span class="page-nav-item-messages" if="collapsible">
                <span class="page-nav-item-message _changed">
                    <span class="page-nav-item-message-icon"></span>
                    <span class="page-nav-item-message-tooltip"
                          data-bind="i18n: 'Changes have been made to this section that have not been saved.'">
                    </span>
                </span>
                <span class="page-nav-item-message _error">
                    <span class="page-nav-item-message-icon"></span>
                    <span class="page-nav-item-message-tooltip"
                          data-bind="i18n: 'This tab contains invalid data. Please resolve this before saving.'">
                    </span>
                </span>
                <span class="page-nav-item-message-loader">
                    <span class="spinner">
                       <span repeat="8"></span>
                    </span>
               </span>
            </span>
        </strong>
    </div>

    <div class="fieldset-wrapper-content"
         css="'collapsible-content': collapsible, '_show': opened, '_hide': !opened()">
        <div                 if="opened() || _wasOpened"
                class="fieldset"
                each="data: elems, as: 'element'" render=""></div>
    </div>
</div>
