<div class="existing-customer" data-block="authentication">
    <!-- ko foreach: getRegion('before') -->
    <!-- ko template: getTemplate() --><!-- /ko -->
    <!-- /ko -->
    <div class="block block-customer-login"
         data-bind="attr: {'data-label': $t('or')}">
        <div class="block-title">
            <h2 class="control-spaces"
                id="block-customer-login-heading"
                data-bind="i18n: 'Existing customer'">
            </h2>
        </div>
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="block-content">
            <form data-role="login"
                  data-bind="submit:login"
                  method="post"
            >
                    <div class="field email required">
                        <div class="control">
                            <input type="email"
                                   class="input-text email control-spaces"
                                   id="login-email"
                                   name="username"
                                   data-bind="attr: {autocomplete: autocomplete, placeholder: placeholderEmail }"
                            />
                        </div>
                    </div>
                    <div class="field password required">
                        <div class="control">
                            <input type="password"
                                   class="input-text password control-spaces"
                                   id="login-password"
                                   name="password"
                                   data-bind="attr: {autocomplete: autocomplete, placeholder: placeholderPassword}"
                                   autocomplete="off"/>
                        </div>
                    </div>
                    <!-- ko foreach: getRegion('additional-login-form-fields') -->
                    <!-- ko template: getTemplate() --><!-- /ko -->
                    <!-- /ko -->
                <div class="secondary forgot-password">
                    <a class="action remind" data-bind="attr: { href: forgotPasswordUrl }">
                        <span data-bind="i18n: 'Forgot Password?'"></span>
                    </a>
                </div>
                <div class="actions-toolbar">
                    <input name="context" type="hidden" value="checkout"/>
                    <div class="primary">
                        <button type="submit" class="action primary action-login"><span
                                data-bind="i18n: 'Login'"></span></button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
