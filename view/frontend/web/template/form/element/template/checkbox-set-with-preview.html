<fieldset class="field"
     visible="visible"
     css="$data.additionalClasses"
     attr="'data-config-scope': $data.scopeLabel, 'data-index': index">
    <legend class="field-label label" if="$data.label" attr="for: uid">
        <span text="label" ifnot="$data.tooltip"></span>
        <span class="tnw-tooltip field-tooltip" if="$data.tooltip">
            <span class="tooltip-toggle">Term:</span>
            <span class="field-tooltip-action"></span>
            <span class="tooltip-content" html="tooltip.description"></span>
        </span>
    </legend>

    <div class="field-control"
         css="'_with-tooltip': $data.tooltip">

        <div class="control-preview" if="$data.showPreview">
            <render args="previewElementTmpl"></render>
        </div>

        <div ifnot="$data.showPreview">
            <div class="field field-option" outereach="options">
                <input
                        ko-checked="$parent.value"
                        ko-disabled="$parent.disabled"
                        css="
                    'control-radio': !$parent.multiple,
                    'control-checkbox': $parent.multiple"
                        attr="
                    id: ++ko.uid,
                    value: value,
                    type: $parent.multiple ? 'checkbox' : 'radio'"/>

                <label class="field-label" text="label" attr="for: ko.uid"></label>
            </div>

            <div class="mage-error" generated="true" if="error" attr="for: uid" text="error"></div>

            <div class="field-note" if="$data.notice" attr="id: noticeId">
                <span html="notice"></span>
            </div>

            <div class="additional-info" if="$data.additionalInfo" html="$data.additionalInfo"></div>

            <render args="$data.service.template" if="$data.hasService()"></render>
        </div>
    </div>
</fieldset>
