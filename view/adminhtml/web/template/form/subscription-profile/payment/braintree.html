<div class="admin__fieldset-wrapper"
     css="$data.additionalClasses"
     attr="'data-level': $data.level, 'data-index': index"
     data-bind="visible: $data.visible === undefined ? true: $data.visible">

    <div class="admin__fieldset-wrapper-content"
         css="'collapsible-content': collapsible, '_show': opened, '_hide': !opened()">
        <form id="co-transparent-form-braintree">
            <div class="admin__fieldset" if="opened() || _wasOpened" each="data: elems, as: 'element'" render=""></div>
            <input id="braintree_submit" style="display:none" type="submit">
        </form>
    </div>
</div>
